org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Warm runs reuse compiled Kotlin/resources and the dependency cache that
# `gradle/actions/setup-gradle` keeps between CI runs. The build cache is
# local to the machine: it makes the release APK step and the native test
# step skip work they already did, instead of recompiling from scratch.
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
# Flutter 3.47+ supports AGP 9 built-in Kotlin. Keep the legacy AGP DSL
# compatibility flag until Flutter completes its new-DSL migration.
android.builtInKotlin=true
android.newDsl=false
