name: Android arm64 build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The three verification jobs run side by side: none needs another's output,
  # and serialising them (the native tests used to gate the APK build) made a
  # run wait ~9 minutes for work that can happen at the same time. A tag's
  # release is still refused unless every one of them passed (see `release`).
  native:
    # The Storage Access Framework root is the app's own directory, and the
    # rules that decide whether a file manager may enter it are the platform's,
    # not this app's: the picker hides a root without FLAG_SUPPORTS_IS_CHILD,
    # and DocumentsProvider.enforceTree() refuses a tree URI whose document is
    # not a descendant of the granted one. Those checks are exercised here on
    # Android 12, the version the picker in the reported bug runs on.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      # Dependency downloads, compiled Kotlin and the wrapper survive between
      # runs; nothing in this job depends on its own checkout surviving.
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Resolve packages
        run: flutter pub get

      - name: Storage provider manifest test
        run: flutter test test/android_manifest_provider_test.dart

      # Flutter generates the untracked Gradle wrapper and local.properties.
      # `--config-only` writes them without assembling, dexing or packaging a
      # debug APK: the release APK step proves the app assembles, and the test
      # task compiles what it needs on its own. The missing debug build was
      # ~6 minutes of the old run's critical path.
      - name: Prepare Android unit tests
        run: flutter build apk --debug --target-platform android-arm64 --no-pub --config-only

      - name: Native storage, engine and credential regression tests
        working-directory: android
        run: |
          set -euo pipefail
          task=$(./gradlew -q :app:tasks --all --console=plain \
            | sed -n 's/^\(testDebug[A-Za-z]*UnitTest\) .*/\1/p' | sort -u | sed -n '1p')
          if [ -z "$task" ]; then
            echo "::error::No debug unit test task was found in :app"
            exit 1
          fi
          ./gradlew ":app:$task" --tests 'com.azx8788.opencode.mini.*'

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Smoke and sanity tests
        # The whole suite: it takes well under a minute and the hand-picked
        # list this replaced silently skipped every test added after it was
        # written (the native-string pairing and the release-tooling checks
        # among them).
        run: flutter test

      - name: Upload conversation layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conversation-layout-${{ github.sha }}
          path: build/qa/conversation-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload local usage layout captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usage-layout-${{ github.sha }}
          path: build/qa/usage-*.png
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.app.outputs.version }}
      artifact: ${{ steps.app.outputs.artifact }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # README "Versioning": CI never commits a bump back to the branch, so it
      # raises versionCode here instead. Android compares versionCode before
      # anything else — without this, every run of the same commit shipped the
      # same code and the newer APK would not install over the older one. The
      # 100000 base keeps CI builds above local ones, because Releases is the
      # channel people install from. Computed in the shell because a workflow
      # `env:` value only accepts a single expression, not arithmetic.
      - name: Raise the versionCode
        run: echo "OC_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # The version lives in pubspec.yaml. Everything downstream (artifact
      # name, APK name, tag check) derives from this one place so a build can
      # never be labelled with a number the app does not carry.
      - name: Read the app version
        id: app
        run: |
          set -euo pipefail
          VERSION=$(awk '/^version:/{print $2; exit}' pubspec.yaml)
          if [ -z "${VERSION}" ]; then
            echo "::error::pubspec.yaml has no version: line"
            exit 1
          fi
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CHANNEL=""
            ARTIFACT="opencode-plus-${VERSION}-arm64"
          else
            CHANNEL="-dev-${SHORT_SHA}"
            ARTIFACT="opencode-plus-${VERSION}${CHANNEL}-arm64"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          echo "apk=opencode-plus-${VERSION}${CHANNEL}-arm64-v8a.apk" >> "$GITHUB_OUTPUT"
          echo "Building ${ARTIFACT} (app version ${VERSION})"

      # A tag is a promise about which build is being published. Refuse the
      # release when the tag and pubspec disagree, before spending any time on
      # a build that would ship under the wrong number.
      - name: Check the tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          EXPECTED="v${{ steps.app.outputs.version }}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match ${EXPECTED} in pubspec.yaml"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter 3.47.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write the release signing key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "No RELEASE_KEYSTORE_BASE64 secret: building with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/android/mini-release.p12"
          cat > "$GITHUB_WORKSPACE/android/key.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/android/mini-release.p12
          storeType=PKCS12
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Resolve packages
        run: flutter pub get

      - name: Build arm64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify and package the APK
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          ls -l "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | sed -n '1,6p'
          if unzip -l "$APK" | grep -qE "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "::error::APK contains non-arm64 native libraries"
            unzip -l "$APK" | grep -E "lib/(armeabi-v7a|x86|x86_64)/" | head
            exit 1
          fi
          # Ship the file under the name people will actually see in their
          # downloads folder, with a checksum beside it.
          mkdir -p dist
          OUT="${{ steps.app.outputs.apk }}"
          cp "$APK" "dist/${OUT}"
          (cd dist && sha256sum "${OUT}" > SHA256SUMS && cat SHA256SUMS)

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.app.outputs.artifact }}
          path: dist/

  # A published build is still gated on every check: the three jobs above run
  # in parallel for speed, and this one only runs for a tag, after all of them
  # passed. A red test therefore never reaches the Releases page.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native, verify, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the packaged APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist/

      - name: Attach the APK to a release
        uses: softprops/action-gh-release@v2
        with:
          name: OpenCode Plus ${{ needs.package.outputs.version }}
          body: |
            Built from ${{ github.sha }}.
            Verify the download against `SHA256SUMS`.
          files: |
            dist/*.apk
            dist/SHA256SUMS
          draft: true
